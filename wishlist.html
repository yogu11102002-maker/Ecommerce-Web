<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dukaan Vale</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <div class="nav">
            <div class="nav-logo border">
                <div class="logo"></div>
            </div>

            <div class="nav-address border">
                <p class="addfirst">Deliver to</p>
                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="addsecond">India</p>
                </div>
            </div>
            <div class="nav-search">
                <input type="text" placeholder="Tell us what you need" class="search-input">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="nav-return border">
                <p><span>Returns</span></p>
                <div class="nav-second">& Orders</div>
            </div>
            <div class="nav-cart">
                <a href="cart.html" style="text-decoration: none;">
                    <i class="fa-solid fa-cart-shopping" ></i>
                    Cart
                    <span id="cart-count">0</span>
                </a>
            </div>
            <div class="nav-cart">
                        <a href="wishlist.html" style="text-decoration: none;">

                            <i class="fa-regular fa-heart"></i>

                            Wishlist

                            <span id="wishlist-count">0</span>

                        </a>
            </div>
        </div>


        <div class="panel">

            <div class="panel-all" id="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </div>


            <div class="sidebar" id="sidebar">

                <i class="fa-solid fa-xmark close-btn" id="close-btn"></i>

                <h2>Dukaan Vale</h2>

                <a href="index.html">Home</a>
                <a href="wishlist.html">Wishlist</a>
                <a href="cart.html">Cart</a>
                <a href="contact.html">Contact</a>
                <a href="grocery.html">
                    Fresh
                </a>

                <a href="cloths.html">
                    Fashion
                </a>

                <a href="electronics.html">
                    Electronics
                </a>
            </div>



            <div class="panel-ops">
                <a href="index.html">
                    <span>Home</span>
                </a>
                <a href="grocery.html">
                    <span>Fresh</span>
                </a>

                <a href="cloths.html">
                    <span>Fashion</span>
                </a>

                <a href="contact.html">
                    <span>Customer Service</span>
                </a>

                <a href="electronics.html">
                    <span>Electronics</span>
                </a>

            </div>



            <div class="panel-vouchers">

                <i class="fa-solid fa-ticket-simple"></i>

                <p>Vouchers</p>

            </div>


        </div>
    </header>


    <!-- ================= HEADING ================= -->

    <section class="cart-heading">

        <h1>My Wishlist</h1>

    </section>


    <!-- ================= WISHLIST ================= -->

    <section class="cart-container">

        <div
            class="cart-items"
            id="wishlist-items">

        </div>


    </section>


    <!-- ================= EMPTY ================= -->

    <div
        id="empty-wishlist"
        style="display:none;">

        <a href="index.html">

            <button class="checkout-btn">

                Continue Shopping

            </button>

        </a>

    </div>


    <script src="script.js"></script>

    <script src="cart.js"></script>

    <script src="wishlist.js"></script>

</body>

</html>
